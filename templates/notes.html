{% extends 'index.html' %}

{% block content %}
<section class="notes-section">
    <h2>Дневник программиста</h2>

    <form action="{{ url_for('notes') }}" method="POST" class="note-form">
        <div class="form-group">
            <label for="title">Заголовок записи:</label>
            <input type="text" id="title" name="title" required placeholder="Введите заголовок">
        </div>

        <div class="form-group">
            <label for="content">Текст записи:</label>
            <textarea id="content" name="content" rows="5" required placeholder="Напишите, что вы изучили сегодня"></textarea>
        </div>

        <button type="submit" class="btn-submit">Добавить запись</button>
    </form>

    <hr class="divider">

    <h3>Ваши записи:</h3>
    <div class="notes-list">
        {% if notes %}
            {% for title, content in notes.items() %}
                <div class="note-card">
                    <h4>{{ title }}</h4>
                    <p>{{ content }}</p>
                </div>
            {% endfor %}
        {% else %}
            <p>Записей нет. Добавьте свою первую запись выше.</p>
        {% endif %}
    </div>
</section>
{% endblock %}
